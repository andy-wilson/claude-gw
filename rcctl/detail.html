<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-gw {{.Title}}</title>
{{template "style"}}
</head>
<body>
<main>
  <header>
    <h1>{{.Title}}: {{.Profile}}</h1>
    <a class="button" href="/">Back</a>
  </header>
  <p id="msg" class="muted"></p>
  {{if .Prune}}<div class="row"><button data-post="/prune/{{.Profile}}" data-confirm="Remove every worktree that is merged, clean and not in use, and delete its branch?">Prune finished worktrees</button></div>{{end}}
  <section><pre>{{.Body}}</pre></section>
</main>
{{template "script"}}
</body>
</html>
